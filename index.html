<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hermanos Fried Chicken · Ordina per il ritiro</title><link rel="icon" href="IMG_4988.png"><link rel="apple-touch-icon" href="IMG_4988.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hermanos"><meta name="theme-color" content="#0b0304">
<style>
:root{--bg1:#0b0304;--bg2:#4d0b0e;--card:#000;--tx:#fff;--mut:#b9a9a9;--ac:#e5262b;--acx:#fff;--yl:#ffc933;--pill:#2a1214;--line:#3a1d1f;--ok:#5fd18a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg1:#fff6f3;--bg2:#ffd6cf;--card:#fff;--tx:#1e0a0b;--mut:#6d5558;--ac:#d11a1f;--acx:#fff;--yl:#f2b705;--pill:#fde7e3;--line:#f0c9c3;--ok:#1f9d57}}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:10}
.w{max-width:480px;margin:0 auto;padding:16px}
.hd{background:#fff;border-radius:20px;padding:10px 14px;text-align:center;margin-bottom:6px}.hd img{height:64px;max-width:100%;object-fit:contain}
.sub{color:var(--mut);font-size:14px;margin:8px 0 14px;text-align:center}
.strip{display:flex;gap:2px;overflow-x:auto;margin-bottom:14px}
.d{flex:1;min-width:52px;text-align:center;background:none;border:0;color:var(--mut);padding:8px 0;border-radius:16px;font:inherit;cursor:pointer}
.d b{display:block;font-size:13px}.d span{font-size:22px;font-weight:600}
.d.on{background:var(--ac);color:var(--acx)}
.card{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.ch{padding:8px 14px;font-weight:600;text-align:center;background:var(--ac);color:var(--acx)}
.ch.y{background:var(--yl);color:#1d1400}
.cb{padding:14px;text-align:center}.mut{color:var(--mut)}
.btn{border:0;border-radius:22px;padding:12px 20px;font:inherit;font-weight:600;background:var(--yl);color:#1d1400;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx)}.btn:disabled{opacity:.4;cursor:default}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.s{background:var(--pill);border:2px solid transparent;border-radius:22px;padding:12px 0;color:var(--tx);font:inherit;font-size:18px;font-weight:600;cursor:pointer}
.s small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.s.on{border-color:var(--yl)}.s:disabled{opacity:.35;text-decoration:line-through;cursor:default}
h2{font-size:18px;margin:20px 0 8px}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--yl);margin:18px 0 8px}
.m{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.m div:first-child{flex:1}
.q{display:flex;align-items:center;gap:10px}.q button{width:32px;height:32px;border-radius:50%;border:0;background:var(--pill);color:var(--tx);font-size:18px;cursor:pointer}
.f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--yl);border-color:var(--yl);color:#1d1400;font-weight:600}
.dish{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.dish.bad{border-color:var(--yl);opacity:.85}
.ic,.ph{width:84px;height:84px;flex:none;border-radius:14px}
.ic{background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:38px}.ph{object-fit:cover}
.inf{flex:1;min-width:0}.ds{color:var(--mut);font-size:13px;margin:2px 0 8px}
.al{display:flex;flex-wrap:wrap;gap:4px}.al span{font-size:11px;background:var(--pill);border-radius:999px;padding:3px 8px;color:var(--mut)}
.al span.hit{background:var(--yl);color:#1d1400;font-weight:600}
.warn{font-size:12px;margin-top:6px;font-weight:600}
.pr{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;font-weight:700}
.add{width:36px;height:36px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-size:22px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0}
.bar>div{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--pill);color:var(--tx);font:inherit;margin-bottom:10px}
label.r{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.cat{display:block;width:100%;height:130px;object-fit:contain;background:#fff;border-radius:14px;margin-bottom:10px}.ph.c{object-fit:contain;background:#fff}
.alert{border:1px solid var(--yl);background:var(--pill);border-radius:14px;padding:10px 12px;font-size:13px;margin:0 0 10px}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
.ok{text-align:center}.ok img{width:140px;height:140px;border-radius:50%}
</style></head>
